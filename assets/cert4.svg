<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Background Canvas -->
  <rect width="1200" height="850" fill="#EAEAEA"/>

  <!-- Outer Frame / Paper -->
  <rect x="30" y="30" width="1140" height="790" fill="#FFFFFF" rx="4" filter="url(#shadow4)"/>

  <!-- Geometric Teal Decorative Corners -->
  <!-- Top Right Large Teal Block -->
  <polygon points="740,30 1170,30 1170,440 1110,440 1110,90 740,90" fill="#035366"/>
  <!-- Bottom Left Teal Block -->
  <polygon points="30,360 80,360 80,770 530,770 530,820 30,820" fill="#035366"/>

  <!-- Double Inner Thin Border Frames -->
  <rect x="75" y="75" width="1050" height="700" fill="none" stroke="#A8B2B9" stroke-width="2.5"/>

  <!-- Header Section: Institution Logo & Name -->
  <g transform="translate(110, 110)">
    <!-- Simulated Logo Icon -->
    <path d="M 0 35 L 22 0 L 32 35 Z" fill="#035366"/>
    <path d="M 12 35 L 34 0 L 44 35 Z" fill="#208396"/>
    <!-- Institution Text -->
    <text x="55" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#035366">Sri Aurobindo Institute</text>
    <text x="55" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#334155">of Management &amp; Science</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#111827" letter-spacing="4">CERTIFICATE</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="28" fill="#334155">Of Participation</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20" fill="#475569">This is to certify that</text>
  </g>

  <!-- Student Name -->
  <g transform="translate(600, 390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#035366">Priyanshu Namdev</text>
    <!-- Underline -->
    <line x1="-220" y1="12" x2="220" y2="12" stroke="#1E293B" stroke-width="1.8"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#475569">has participated in the</text>
  </g>

  <!-- Workshop Title -->
  <g transform="translate(600, 480)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0F172A">One-day workshop on "Smart Hospitals: Leveraging</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0F172A">AI for Effective Healthcare Management"</text>
  </g>

  <!-- Date & Venue -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#334155">Held on <tspan font-weight="800" fill="#035366">November 7th, 2025</tspan></text>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#64748B">at Sri Aurobindo Institute of Management &amp; Science</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17" fill="#1E293B">Organized by Department of Hospital Administration</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" font-size="15" fill="#64748B">We appreciate your valuable presence.</text>
  </g>

  <!-- Signatures Line -->
  <g transform="translate(120, 700)">
    <!-- Signature 1 -->
    <g transform="translate(100, 0)">
      <path d="M -30 -15 C -10 -35, 10 5, 20 -20 T 50 -10 L 70 -5" fill="none" stroke="#1E293B" stroke-width="2.2"/>
      <line x1="-70" y1="5" x2="170" y2="5" stroke="#334155" stroke-width="1.2"/>
      <text x="50" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#0F172A">DR. SARTHAK SEN GUPTA</text>
      <text x="50" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">ASSISTANT PROFESSOR</text>
      <text x="50" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">IIHMR, BANGALORE</text>
    </g>

    <!-- Signature 2 -->
    <g transform="translate(480, 0)">
      <path d="M -20 -10 C 0 -40, 30 -5, 40 -30 T 70 -15" fill="none" stroke="#1E293B" stroke-width="2.2"/>
      <line x1="-70" y1="5" x2="170" y2="5" stroke="#334155" stroke-width="1.2"/>
      <text x="50" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#0F172A">DR. KUNAL RAWAL</text>
      <text x="50" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">ASSOCIATE PROFESSOR AND</text>
      <text x="50" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">HEAD, HA, SAIM&amp;S</text>
    </g>

    <!-- Signature 3 -->
    <g transform="translate(850, 0)">
      <path d="M -25 -20 C -5 -35, 15 -5, 35 -25 T 65 -10" fill="none" stroke="#1E293B" stroke-width="2.2"/>
      <line x1="-70" y1="5" x2="170" y2="5" stroke="#334155" stroke-width="1.2"/>
      <text x="50" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#0F172A">DR. AAQUIL BUNGLOWALA</text>
      <text x="50" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">DIRECTOR</text>
      <text x="50" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">SAIT</text>
    </g>
  </g>
</svg>
