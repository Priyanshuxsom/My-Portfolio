<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="35%" stop-color="#FF9000"/>
      <stop offset="100%" stop-color="#EE5020"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(200,200,220,0.18)" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#FFFFFF"/>
  <rect x="400" y="0" width="800" height="850" fill="url(#grid)"/>

  <!-- Left Orange/Yellow Brand Banner -->
  <rect x="0" y="0" width="400" height="850" fill="url(#grad1)"/>

  <!-- LetsUpgrade Logo Box -->
  <g transform="translate(40, 30)">
    <rect width="310" height="130" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
    <!-- Logo Icon -->
    <g transform="translate(25, 25)">
      <circle cx="20" cy="20" r="5" fill="#EE5020"/>
      <circle cx="45" cy="10" r="4.5" fill="#FF9000"/>
      <circle cx="60" cy="28" r="4" fill="#FF9000"/>
      <circle cx="55" cy="52" r="4" fill="#FF9000"/>
      <circle cx="35" cy="65" r="4.5" fill="#FF9000"/>
      <circle cx="10" cy="55" r="4" fill="#EE5020"/>
      <circle cx="5" cy="32" r="4" fill="#EE5020"/>
      <polygon points="20,20 40,28 32,45" fill="#222222"/>
      <path d="M 12 38 L 48 20 L 40 58 Z" fill="#333333"/>
    </g>
    <!-- Logo Text -->
    <text x="125" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#111111">Lets</text>
    <text x="125" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#111111">Upgrade</text>
  </g>

  <!-- Left Bottom Meta Info -->
  <g transform="translate(40, 720)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="1">DATE OF ISSUE: 28 JULY 2026</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="0.5">CERTIFICATE NO: 6a0eeff56259824b2cbc0948</text>
    <text x="0" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="1">WWW.LETSUPGRADE.IN/VERIFY</text>
  </g>

  <!-- Right Certificate Content -->
  <g transform="translate(470, 160)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" fill="#222222" letter-spacing="3">THIS IS TO CERTIFY THAT</text>
    
    <!-- Student Name -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#111111" letter-spacing="0.5">Priyanshu Namdev</text>
    
    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" fill="#222222" letter-spacing="3">HAS SUCCESSFULLY COMPLETED</text>
    
    <!-- Course Title -->
    <text x="0" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="42" fill="#111111">Python for Data Science (Basic)</text>

    <!-- Collaboration Section -->
    <text x="0" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#111111" letter-spacing="2">IN COLLABORATION WITH</text>
    
    <!-- Logos Row -->
    <g transform="translate(0, 360)">
      <!-- NSDC Logo simulation -->
      <g transform="translate(0, 0)">
        <path d="M20,10 L30,30 L10,30 Z" fill="#2B6CB0"/>
        <circle cx="20" cy="12" r="5" fill="#D69E2E"/>
        <text x="40" y="20" font-family="sans-serif" font-weight="800" font-size="14" fill="#1A365D">N·S·D·C</text>
        <text x="40" y="34" font-family="sans-serif" font-weight="600" font-size="10" fill="#2B6CB0">National Skill Development</text>
      </g>

      <!-- ITM Logo simulation -->
      <g transform="translate(240, -10)">
        <circle cx="35" cy="35" r="30" fill="none" stroke="#1A365D" stroke-width="3"/>
        <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#1A365D">ITM</text>
        <text x="80" y="40" font-family="sans-serif" font-weight="700" font-size="13" fill="#222">ITM Edutech Training Pvt. Ltd.</text>
      </g>

      <!-- GDG MAD Logo simulation -->
      <g transform="translate(520, 0)">
        <path d="M0,15 L15,0 L30,15 L15,30 Z" fill="#4285F4"/>
        <path d="M20,25 L35,10 L50,25 L35,40 Z" fill="#34A853"/>
        <text x="58" y="25" font-family="sans-serif" font-weight="800" font-size="18" fill="#333">GDG MAD</text>
      </g>
    </g>
  </g>
</svg>
